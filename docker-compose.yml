services:
  app:
    build: .
    container_name: laravel_app
    volumes:
      - .:/app
      - vendor:/app/vendor
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - mysql
    command: >
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs &&
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      php artisan key:generate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"
    restart: always

  mysql:
    image: mysql:8
    container_name: mysql_container
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
  vendor: